apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leave-ingress
  namespace: leave-management
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: leave-api-service
                port:
                  number: 5000
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: leave-api-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: leave-frontend-service
                port:
                  number: 80
