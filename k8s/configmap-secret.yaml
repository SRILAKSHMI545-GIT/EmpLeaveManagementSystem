apiVersion: v1
kind: Namespace
metadata:
  name: leave-management
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: leave-api-config
  namespace: leave-management
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Jwt__Issuer: "LeaveManagementApi"
  Jwt__Audience: "LeaveManagementClient"
  Jwt__ExpiryMinutes: "60"
  Jwt__RefreshTokenExpiryDays: "7"
---
apiVersion: v1
kind: Secret
metadata:
  name: leave-api-secret
  namespace: leave-management
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Server=sqlserver-service.leave-management.svc.cluster.local,1433;Database=LeaveManagementDb;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;MultipleActiveResultSets=true"
  Jwt__SecretKey: "ThisIsASecretKeyForJwtAuthenticationLeaveManagementSystem2026AtLeast32BytesLong!"
