apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver-deployment
  namespace: leave-management
  labels:
    app: sqlserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              value: "Your_password123!"
            - name: MSSQL_PID
              value: "Developer"
          ports:
            - containerPort: 1433
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-service
  namespace: leave-management
spec:
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433
